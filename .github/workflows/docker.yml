name: Build and push Docker image
run-name: ${{ startsWith(github.ref, 'refs/tags/') && format('{0} - Docker Build', github.ref_name) || (github.event_name == 'workflow_dispatch' && inputs.version != '' && format('{0} - Docker Build', inputs.version)) || github.event.head_commit.message }}

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to apply (e.g. v1.0.0)"
        required: false
        default: ""

jobs:
  build:
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(main): release') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'demeesterroel' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract semver from tag
        if: startsWith(github.ref, 'refs/tags/')
        id: semver
        run: echo "value=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata (GHCR)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/demeesterroel/carsharing
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short,enable={{is_default_branch}}
            type=raw,value={{tag}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ steps.semver.outputs.value }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}

      - name: Build and push to GHCR
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Docker metadata (Docker Hub)
        id: meta-hub
        uses: docker/metadata-action@v6
        with:
          images: demeesterroel/carsharing
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{tag}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ steps.semver.outputs.value }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}

      - name: Push to Docker Hub
        uses: docker/build-push-action@v7
        continue-on-error: true
        with:
          context: .
          push: true
          tags: ${{ steps.meta-hub.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
