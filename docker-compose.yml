# docker-compose.yml — CarSharing self-hosting stack
# Usage: docker compose up -d

services:
  carsharing:
    image: ghcr.io/demeesterroel/carsharing:latest
    restart: unless-stopped
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
        delay: 2s
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode < 500 ? 0 : 1))"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./tenants.json:/app/tenants.json
    environment:
      - DB_PATH=/app/data/carsharing.db
      - SESSION_PASSWORD=${SESSION_PASSWORD:?Set SESSION_PASSWORD in .env}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - CRON_SECRET=${CRON_SECRET:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - MAIL_FROM=${MAIL_FROM:-noreply@example.com}
      - DEFAULT_TENANT_SLUG=${DEFAULT_TENANT_SLUG:-autodelen}
